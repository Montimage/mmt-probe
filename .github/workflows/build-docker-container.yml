name: C/C++ CI

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/montimage/mmt-probe

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize variables
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.PACKAGE_VERSION }}-${{ matrix.tag_suffix }}

  # create a single tag (e.g. ghcr.io/montimage/mmt-probe:latest) to automatically 
  #  point to different images depending on the client's architecture
  manifest:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Initialize variables
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ env.PACKAGE_VERSION }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ env.PACKAGE_VERSION }}-amd64 \
            ${{ env.IMAGE }}:${{ env.PACKAGE_VERSION }}-arm64
